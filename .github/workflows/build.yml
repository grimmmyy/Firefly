name: Build Firefly

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["**.md", "pi/**", "assets/*.svg"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Tags (v1.2.3) build that version; everything else builds 1.0.<run> (above the last release).
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.0.{0}', github.run_number) }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Fill in missing Flutter scaffolding
        run: flutter create . --platforms=android,ios --org com.firefly --project-name firefly

      - run: flutter pub get

      - name: Version
        shell: bash
        run: echo "VERSION_NUM=${VERSION#v}" >> "$GITHUB_ENV"

      - name: App icons
        run: dart run flutter_launcher_icons -f icons-mobile.yaml

      - name: Build release APK
        run: flutter build apk --release --build-name=${{ env.VERSION_NUM }} --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: firefly-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    name: iOS unsigned IPA
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Fill in missing Flutter scaffolding
        run: flutter create . --platforms=android,ios --org com.firefly --project-name firefly

      - run: flutter pub get

      - name: Version
        shell: bash
        run: echo "VERSION_NUM=${VERSION#v}" >> "$GITHUB_ENV"

      - name: App icons
        run: dart run flutter_launcher_icons -f icons-mobile.yaml

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign --build-name=${{ env.VERSION_NUM }} --build-number=${{ github.run_number }}

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry Firefly-unsigned.ipa Payload
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: firefly-ios-unsigned-ipa
          path: build/ios/ipa/Firefly-unsigned.ipa
          if-no-files-found: error

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Fill in missing Flutter scaffolding
        run: flutter create . --platforms=windows --org com.firefly --project-name firefly

      - run: flutter pub get

      - name: Version
        shell: bash
        run: echo "VERSION_NUM=${VERSION#v}" >> "$GITHUB_ENV"

      - name: App icons
        run: dart run flutter_launcher_icons -f icons-windows.yaml

      - name: Build Windows release
        run: flutter build windows --release --build-name=${{ env.VERSION_NUM }} --build-number=${{ github.run_number }}

      - name: Package zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Firefly-windows.zip

      - name: Build installer (Firefly-Setup.exe)
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { choco install innosetup -y --no-progress | Out-Null; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /Qp "/DAppVersion=$env:VERSION_NUM" "/DSourceDir=$PWD/build/windows/x64/runner/Release" windows-installer.iss
          if (-not (Test-Path dist\Firefly-Setup.exe)) { throw "installer not produced" }

      - uses: actions/upload-artifact@v4
        with:
          name: firefly-windows
          path: |
            Firefly-windows.zip
            dist/Firefly-Setup.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    # Only publish when EVERY platform built: a release always has EXE + IPA + APK.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Collect assets (fail if any platform is missing)
        run: |
          V="${GITHUB_REF_NAME}"
          mkdir -p out
          need() { [ -f "$1" ] || { echo "::error::missing $1"; exit 1; }; cp "$1" "out/$2"; }
          need dist/firefly-windows/dist/Firefly-Setup.exe        "Firefly-${V}-windows-setup.exe"
          need dist/firefly-windows/Firefly-windows.zip           "Firefly-${V}-windows-portable.zip"
          need dist/firefly-ios-unsigned-ipa/Firefly-unsigned.ipa "Firefly-${V}-ios.ipa"
          need dist/firefly-android-apk/app-release.apk           "Firefly-${V}-android.apk"
          tar -czf "out/spotcast-pi-bridge-${V}.tar.gz" pi
          (cd out && sha256sum * > SHA256SUMS.txt)
          ls -la out
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME}"
          NOTES=".github/release-notes/${V}.md"
          [ -f "$NOTES" ] || { gh api repos/${{ github.repository }}/releases/generate-notes -f tag_name="$V" -q .body > /tmp/notes.md; NOTES=/tmp/notes.md; }
          if gh release view "$V" >/dev/null 2>&1; then
            gh release upload "$V" out/* --clobber
            gh release edit "$V" --title "Firefly ${V}" --notes-file "$NOTES" --draft=false --latest
          else
            gh release create "$V" out/* --title "Firefly ${V}" --notes-file "$NOTES" --latest
          fi
