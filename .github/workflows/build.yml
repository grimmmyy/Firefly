name: Build Firefly

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.5"

      - name: Fill in missing Flutter scaffolding
        run: flutter create . --platforms=android,ios --org com.firefly --project-name firefly

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: firefly-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    name: iOS unsigned IPA
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.5"

      - name: Fill in missing Flutter scaffolding
        run: flutter create . --platforms=android,ios --org com.firefly --project-name firefly

      - run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry Firefly-unsigned.ipa Payload
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: firefly-ios-unsigned-ipa
          path: build/ios/ipa/Firefly-unsigned.ipa
          if-no-files-found: error

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Fill in missing Flutter scaffolding
        run: flutter create . --platforms=windows --org com.firefly --project-name firefly

      - run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Firefly-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: firefly-windows
          path: Firefly-windows.zip
          if-no-files-found: error
