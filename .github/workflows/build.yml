name: Build Firefly

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["**.md", "pi/**", "assets/*.svg"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Tags (v1.2.3) build that version; everything else builds 1.0.<run> (above the last release).
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.0.{0}', github.run_number) }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Fill in missing Flutter scaffolding
        run: flutter create . --platforms=android,ios --org com.firefly --project-name firefly

      - run: flutter pub get

      - name: Version
        shell: bash
        run: echo "VERSION_NUM=${VERSION#v}" >> "$GITHUB_ENV"

      - name: App icons
        run: dart run flutter_launcher_icons -f icons-mobile.yaml

      - name: Build release APK
        run: flutter build apk --release --build-name=${{ env.VERSION_NUM }} --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: firefly-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    name: iOS unsigned IPA
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Fill in missing Flutter scaffolding
        run: flutter create . --platforms=android,ios --org com.firefly --project-name firefly

      - run: flutter pub get

      - name: Version
        shell: bash
        run: echo "VERSION_NUM=${VERSION#v}" >> "$GITHUB_ENV"

      - name: App icons
        run: dart run flutter_launcher_icons -f icons-mobile.yaml

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign --build-name=${{ env.VERSION_NUM }} --build-number=${{ github.run_number }}

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry Firefly-unsigned.ipa Payload
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: firefly-ios-unsigned-ipa
          path: build/ios/ipa/Firefly-unsigned.ipa
          if-no-files-found: error

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Fill in missing Flutter scaffolding
        run: flutter create . --platforms=windows --org com.firefly --project-name firefly

      - run: flutter pub get

      - name: Version
        shell: bash
        run: echo "VERSION_NUM=${VERSION#v}" >> "$GITHUB_ENV"

      - name: App icons
        run: dart run flutter_launcher_icons -f icons-windows.yaml

      - name: Build Windows release
        run: flutter build windows --release --build-name=${{ env.VERSION_NUM }} --build-number=${{ github.run_number }}

      - name: Package zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Firefly-windows.zip

      - name: Build installer (Firefly-Setup.exe)
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { choco install innosetup -y --no-progress | Out-Null; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /Qp "/DAppVersion=$env:VERSION_NUM" "/DSourceDir=$PWD/build/windows/x64/runner/Release" windows-installer.iss
          if (-not (Test-Path dist\Firefly-Setup.exe)) { throw "installer not produced" }

      - uses: actions/upload-artifact@v4
        with:
          name: firefly-windows
          path: |
            Firefly-windows.zip
            dist/Firefly-Setup.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    # Only publish when EVERY platform built: a release always has EXE + IPA + APK.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Collect assets (fail if any platform is missing)
        run: |
          V="${GITHUB_REF_NAME}"
          mkdir -p out
          need() { [ -f "$1" ] || { echo "::error::missing $1"; exit 1; }; cp "$1" "out/$2"; }
          need dist/firefly-windows/dist/Firefly-Setup.exe        "Firefly-${V}-windows-setup.exe"
          need dist/firefly-windows/Firefly-windows.zip           "Firefly-${V}-windows-portable.zip"
          need dist/firefly-ios-unsigned-ipa/Firefly-unsigned.ipa "Firefly-${V}-ios.ipa"
          need dist/firefly-android-apk/app-release.apk           "Firefly-${V}-android.apk"
          tar -czf "out/spotcast-pi-bridge-${V}.tar.gz" pi
          (cd out && sha256sum * > SHA256SUMS.txt)
          ls -la out
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME}"
          NOTES=".github/release-notes/${V}.md"
          [ -f "$NOTES" ] || { gh api repos/${{ github.repository }}/releases/generate-notes -f tag_name="$V" -q .body > /tmp/notes.md; NOTES=/tmp/notes.md; }
          if gh release view "$V" >/dev/null 2>&1; then
            gh release upload "$V" out/* --clobber
            gh release edit "$V" --title "Firefly ${V}" --notes-file "$NOTES" --draft=false --latest
          else
            gh release create "$V" out/* --title "Firefly ${V}" --notes-file "$NOTES" --latest
          fi

  nightly:
    name: Publish nightly + AltStore source
    # Every successful branch push replaces the rolling "nightly" pre-release.
    # AltStore reads altstore.json from it (Updates tab), and the Pi mirrors it
    # to its download page (pi/firefly-dl-sync.sh).
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    needs: [android, ios, windows]
    runs-on: ubuntu-latest
    concurrency: nightly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Collect assets and write the AltStore source
        env:
          REPO: ${{ github.repository }}
          BUILD: ${{ github.run_number }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          V="${VERSION#v}"
          mkdir -p out
          cp dist/firefly-ios-unsigned-ipa/Firefly-unsigned.ipa out/Firefly-ios.ipa
          cp dist/firefly-android-apk/app-release.apk           out/Firefly-android.apk
          cp dist/firefly-windows/dist/Firefly-Setup.exe        out/Firefly-windows-setup.exe
          BASE="https://github.com/${REPO}/releases/download/nightly"
          SIZE=$(stat -c %s out/Firefly-ios.ipa)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          MSG=$(git log -1 --pretty=%s | head -c 300)
          V="$V" BUILD="$BUILD" SIZE="$SIZE" DATE="$DATE" BASE="$BASE" REPO="$REPO" MSG="$MSG" BRANCH="$BRANCH" python3 - <<'PY'
          import json, os
          e = os.environ
          ver = {"version": e["V"], "buildVersion": e["BUILD"], "date": e["DATE"],
                 "localizedDescription": e["MSG"] + "\n(branch " + e["BRANCH"] + ")",
                 "downloadURL": e["BASE"] + "/Firefly-ios.ipa", "size": int(e["SIZE"]),
                 "minOSVersion": "15.0"}
          app = {"name": "Firefly", "bundleIdentifier": "com.firefly.firefly",
                 "developerName": "grimmmyy", "subtitle": "Cast to the living-room receiver",
                 "localizedDescription": "Firefly controls the Yamaha RX-V671 and the Pi bridge.",
                 "iconURL": f"https://raw.githubusercontent.com/{e['REPO']}/HEAD/assets/icon.png",
                 "tintColor": "#F5B841", "versions": [ver],
                 # AltStore 1.x reads these flat fields
                 "version": ver["version"], "versionDate": ver["date"],
                 "versionDescription": ver["localizedDescription"],
                 "downloadURL": ver["downloadURL"], "size": ver["size"]}
          src = {"name": "Firefly", "identifier": "com.firefly.source",
                 "sourceURL": e["BASE"] + "/altstore.json",
                 "iconURL": app["iconURL"], "apps": [app], "news": []}
          json.dump(src, open("out/altstore.json", "w"), indent=2)
          json.dump({"version": e["V"], "build": int(e["BUILD"]), "date": e["DATE"]},
                    open("out/version.json", "w"))
          PY
          ls -la out
      - name: Replace the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --cleanup-tag -y 2>/dev/null || true
          gh release create nightly out/* --target "${{ github.sha }}" --prerelease \
            --title "Firefly nightly ${VERSION#v}" \
            --notes "Latest successful build of ${{ github.ref_name }} (${{ github.sha }}). AltStore source: https://github.com/${{ github.repository }}/releases/download/nightly/altstore.json"
